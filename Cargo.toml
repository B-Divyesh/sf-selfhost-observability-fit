[package]
name = "selfhost-observability-fit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
description = "Neutral OTLP workload sizing for self-hosted observability stacks"
license = "MIT"
repository = "https://github.com/B-Divyesh/sf-selfhost-observability-fit"
readme = "README.md"
keywords = ["opentelemetry", "observability", "otlp", "cli"]
categories = ["command-line-utilities", "development-tools"]
exclude = ["site/", ".factory/"]

[lib]
name = "observability_fit"
path = "src/lib.rs"

[[bin]]
name = "obsfit"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

[dev-dependencies]
tempfile = "3.20"

[profile.release]
lto = "thin"
strip = true
codegen-units = 1
